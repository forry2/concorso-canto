version: '3.8'

# Architettura sul Raspberry Pi:
#
#   Internet → nginx host (porta 443, SSL, vhost: inoutcontest.robybrown.duckdns.org)
#                  ↓ HTTP proxy
#              container: frontend (Next.js, porta 3001)
#                  ↓ chiamate interne Docker
#              container: backend (Express, porta 4000 - non esposta all'esterno)
#                  ↓ (filesystem)
#              volume: ./data/ (SQLite + uploads)
#
# nginx host punta a localhost:3001 per questo vhost.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:4000
    env_file:
      - .env.production
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "4000"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PORT=4000
    env_file:
      - .env.production
    restart: unless-stopped
